<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>@legal-defense — IP Compliance Agent</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@300;400;500&family=Geist:wght@300;400;500;600&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #09090b;
  --bg1: #111113;
  --bg2: #18181b;
  --bg3: #1c1c1f;
  --line: #27272a;
  --line2: #3f3f46;
  --tx1: #fafafa;
  --tx2: #a1a1aa;
  --tx3: #52525b;
  --blue: #3b82f6;
  --blue-dim: rgba(59,130,246,0.08);
  --red: #f43f5e;
  --red-dim: rgba(244,63,94,0.08);
  --green: #22c55e;
  --green-dim: rgba(34,197,94,0.08);
  --amber: #f59e0b;
  --mono: 'Geist Mono', monospace;
  --sans: 'Geist', system-ui, sans-serif;
}

html, body { height: 100%; background: var(--bg); color: var(--tx1); font-family: var(--sans); font-size: 13px; }

/* ── TOP BAR ── */
nav {
  height: 40px;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  padding: 0 20px;
  gap: 0;
  background: var(--bg1);
  position: sticky;
  top: 0;
  z-index: 10;
}

.nav-brand {
  display: flex;
  align-items: center;
  gap: 8px;
  padding-right: 20px;
  border-right: 1px solid var(--line);
  margin-right: 20px;
}

.shield {
  width: 20px;
  height: 20px;
  background: var(--blue);
  clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
  flex-shrink: 0;
}

.nav-brand span {
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 500;
  color: var(--tx1);
  letter-spacing: -0.3px;
}

.nav-tag {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--tx3);
  background: var(--bg3);
  border: 1px solid var(--line);
  padding: 2px 7px;
  border-radius: 3px;
}

.nav-right {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 16px;
}

.status {
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: var(--mono);
  font-size: 10px;
  color: var(--tx3);
}

.status-led {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 6px var(--green);
  animation: led 2s ease-in-out infinite;
}

@keyframes led { 0%,100%{opacity:1} 50%{opacity:.3} }

.gh-badge {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--tx3);
  border: 1px solid var(--line);
  padding: 3px 8px;
  border-radius: 3px;
}

/* ── LAYOUT ── */
.workspace {
  display: grid;
  grid-template-columns: 1fr 1fr;
  height: calc(100vh - 40px);
}

/* ── PANELS ── */
.pane {
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.pane-left { border-right: 1px solid var(--line); }

.pane-header {
  height: 36px;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  padding: 0 16px;
  gap: 10px;
  background: var(--bg1);
  flex-shrink: 0;
}

.pane-title {
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 500;
  color: var(--tx3);
  text-transform: uppercase;
  letter-spacing: 1px;
}

.pane-actions {
  margin-left: auto;
  display: flex;
  gap: 6px;
}

.action-btn {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--tx3);
  background: none;
  border: 1px solid var(--line);
  padding: 3px 8px;
  border-radius: 3px;
  cursor: pointer;
  transition: all .15s;
}

.action-btn:hover { color: var(--tx2); border-color: var(--line2); }

/* ── EDITOR ── */
.editor-wrap {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
}

.line-numbers {
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 44px;
  padding: 16px 0;
  display: flex;
  flex-direction: column;
  gap: 0;
  pointer-events: none;
  border-right: 1px solid var(--line);
  background: var(--bg1);
}

.ln {
  font-family: var(--mono);
  font-size: 12px;
  line-height: 1.7;
  color: var(--tx3);
  text-align: right;
  padding-right: 10px;
  height: 20.4px;
}

textarea#code {
  flex: 1;
  background: var(--bg);
  border: none;
  outline: none;
  color: #c4b5fd;
  font-family: var(--mono);
  font-size: 12px;
  line-height: 1.7;
  padding: 16px 16px 16px 56px;
  resize: none;
  width: 100%;
  height: 100%;
  caret-color: var(--blue);
}

textarea#code::placeholder { color: var(--tx3); }

/* ── BOTTOM BAR ── */
.editor-footer {
  border-top: 1px solid var(--line);
  padding: 10px 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--bg1);
  flex-shrink: 0;
}

.scan-btn {
  flex: 1;
  height: 32px;
  background: var(--blue);
  color: #fff;
  border: none;
  border-radius: 4px;
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.3px;
  cursor: pointer;
  transition: all .15s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
}

.scan-btn:hover { filter: brightness(1.1); }
.scan-btn:disabled { background: var(--bg3); color: var(--tx3); cursor: not-allowed; filter: none; }

.char-count {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--tx3);
  white-space: nowrap;
}

/* ── RESULT PANE ── */
.result-body {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

/* empty */
.empty {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
  color: var(--tx3);
}

.empty-grid {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 8px;
  width: 240px;
}

.empty-cell {
  height: 4px;
  border-radius: 2px;
  background: var(--line);
}

.empty-cell:nth-child(1) { background: var(--red); opacity:.3; }
.empty-cell:nth-child(5) { background: var(--amber); opacity:.3; }
.empty-cell:nth-child(9) { background: var(--green); opacity:.3; }

.empty p {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--tx3);
  text-align: center;
  line-height: 1.8;
}

/* loading */
.loading {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  flex: 1;
  gap: 12px;
}

.spinner {
  width: 20px;
  height: 20px;
  border: 1.5px solid var(--line2);
  border-top-color: var(--blue);
  border-radius: 50%;
  animation: spin .7s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

.loading-text {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--tx3);
}

/* result blocks */
.block {
  background: var(--bg1);
  border: 1px solid var(--line);
  border-radius: 4px;
  overflow: hidden;
}

.block-head {
  padding: 8px 12px;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--bg2);
}

.block-title {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--tx2);
  font-weight: 500;
}

.tag {
  font-family: var(--mono);
  font-size: 9px;
  padding: 2px 6px;
  border-radius: 2px;
  font-weight: 600;
  letter-spacing: 0.5px;
  text-transform: uppercase;
}

.tag-red { background: var(--red-dim); color: var(--red); border: 1px solid rgba(244,63,94,.2); }
.tag-green { background: var(--green-dim); color: var(--green); border: 1px solid rgba(34,197,94,.2); }
.tag-amber { background: rgba(245,158,11,.08); color: var(--amber); border: 1px solid rgba(245,158,11,.2); }

.block-body {
  padding: 14px;
  font-family: var(--mono);
  font-size: 12px;
  line-height: 1.8;
  color: var(--tx2);
  white-space: pre-wrap;
  word-break: break-word;
}

.ts {
  margin-left: auto;
  font-family: var(--mono);
  font-size: 10px;
  color: var(--tx3);
}

.cursor-blink {
  display: inline-block;
  width: 1.5px;
  height: 13px;
  background: var(--blue);
  margin-left: 1px;
  vertical-align: middle;
  animation: blink 1s step-end infinite;
}

@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

/* presets */
.preset-row {
  display: flex;
  gap: 6px;
  padding: 8px 12px;
  border-top: 1px solid var(--line);
  background: var(--bg1);
  flex-wrap: wrap;
  flex-shrink: 0;
}

.preset {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--tx3);
  background: none;
  border: 1px solid var(--line);
  padding: 3px 8px;
  border-radius: 3px;
  cursor: pointer;
  transition: all .15s;
  white-space: nowrap;
}

.preset:hover { color: var(--tx2); border-color: var(--line2); background: var(--bg2); }
.preset.gpl:hover { color: var(--red); border-color: rgba(244,63,94,.3); }
.preset.clean:hover { color: var(--green); border-color: rgba(34,197,94,.3); }

/* scrollbar */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--line); border-radius: 2px; }
</style>
</head>
<body>

<nav>
  <div class="nav-brand">
    <div class="shield"></div>
    <span>legal-defense-agent</span>
  </div>
  <span class="nav-tag">GitHub Copilot Extension</span>
  <div class="nav-right">
    <div class="status">
      <div class="status-led" id="led"></div>
      <span id="statusTxt">checking...</span>
    </div>
    <span class="gh-badge">Microsoft Agents League</span>
  </div>
</nav>

<div class="workspace">

  <!-- LEFT: CODE INPUT -->
  <div class="pane pane-left">
    <div class="pane-header">
      <span class="pane-title">Code Input</span>
      <div class="pane-actions">
        <button class="action-btn" onclick="clearCode()">clear</button>
      </div>
    </div>

    <div class="editor-wrap">
      <div class="line-numbers" id="lineNums">
        <div class="ln">1</div>
      </div>
      <textarea id="code" spellcheck="false"
        placeholder="// paste code to scan for license violations"
        oninput="updateLines(); updateCount()"></textarea>
    </div>

    <div class="preset-row">
      <button class="preset gpl" onclick="load('gpl')">gpl-linux</button>
      <button class="preset gpl" onclick="load('wp')">gpl-wordpress</button>
      <button class="preset gpl" onclick="load('ffmpeg')">gpl-ffmpeg</button>
      <button class="preset gpl" onclick="load('sspl')">sspl-mongodb</button>
      <button class="preset clean" onclick="load('clean')">clean-code</button>
    </div>

    <div class="editor-footer">
      <button class="scan-btn" id="scanBtn" onclick="scan()">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        scan for violations
      </button>
      <span class="char-count" id="charCount">0 chars</span>
    </div>
  </div>

  <!-- RIGHT: RESULTS -->
  <div class="pane">
    <div class="pane-header">
      <span class="pane-title">Agent Response</span>
      <div class="pane-actions">
        <button class="action-btn" onclick="clearResult()">clear</button>
      </div>
    </div>
    <div class="result-body" id="resultBody">
      <div class="empty" id="emptyState">
        <div class="empty-grid">
          <div class="empty-cell"></div><div class="empty-cell"></div><div class="empty-cell"></div>
          <div class="empty-cell"></div><div class="empty-cell"></div><div class="empty-cell"></div>
          <div class="empty-cell"></div><div class="empty-cell"></div><div class="empty-cell"></div>
        </div>
        <p>paste code in the editor<br/>and run a scan to detect<br/>license violations</p>
      </div>
    </div>
  </div>

</div>

<script>
const URL = 'https://legal-defense-agent-la5f.onrender.com';

const snippets = {
  gpl: `// Linux kernel linked-list — GPL-2.0
struct list_head *pos, *tmp;
LIST_HEAD_INIT(my_list);

list_for_each_entry(pos, &head, member) {
    if (pos->val > threshold)
        list_del(&pos->member);
}`,
  wp: `// WordPress hook system — GPL-2.0
function my_plugin_init() {
    add_action('wp_head', 'inject_styles');
    $content = apply_filters('the_content', $raw);
    do_action('save_post', $post_id, $post);
}
add_action('init', 'my_plugin_init');`,
  ffmpeg: `// FFmpeg AVCodec API — GPL-2.0
AVFormatContext *fmt_ctx = NULL;
avformat_open_input(&fmt_ctx, path, NULL, NULL);
AVCodecContext *dec_ctx = avcodec_alloc_context3(codec);
avcodec_open2(dec_ctx, codec, NULL);
av_read_frame(fmt_ctx, &pkt);`,
  sspl: `// MongoDB driver pattern — SSPL-1.0
const client = await MongoClient.connect(uri);
const db = client.db('myDatabase');
const docs = await db.collection('users')
    .find({}).toArray();`,
  clean: `// Clean implementation — no license issues
function binarySearch(arr, target) {
  let lo = 0, hi = arr.length - 1;
  while (lo <= hi) {
    const mid = (lo + hi) >>> 1;
    if (arr[mid] === target) return mid;
    arr[mid] < target ? lo = mid + 1 : hi = mid - 1;
  }
  return -1;
}`
};

function load(k) {
  document.getElementById('code').value = snippets[k];
  updateLines(); updateCount();
}

function clearCode() {
  document.getElementById('code').value = '';
  updateLines(); updateCount();
}

function clearResult() {
  document.getElementById('resultBody').innerHTML = `
    <div class="empty" id="emptyState">
      <div class="empty-grid">
        <div class="empty-cell"></div><div class="empty-cell"></div><div class="empty-cell"></div>
        <div class="empty-cell"></div><div class="empty-cell"></div><div class="empty-cell"></div>
        <div class="empty-cell"></div><div class="empty-cell"></div><div class="empty-cell"></div>
      </div>
      <p>paste code in the editor<br/>and run a scan to detect<br/>license violations</p>
    </div>`;
}

function updateLines() {
  const lines = document.getElementById('code').value.split('\n');
  const nums = document.getElementById('lineNums');
  nums.innerHTML = lines.map((_,i) => `<div class="ln">${i+1}</div>`).join('');
}

function updateCount() {
  const n = document.getElementById('code').value.length;
  document.getElementById('charCount').textContent = `${n} chars`;
}

async function checkHealth() {
  try {
    const r = await fetch(URL + '/health');
    const d = await r.json();
    document.getElementById('statusTxt').textContent = 'online';
    document.getElementById('led').style.background = '#22c55e';
  } catch {
    document.getElementById('statusTxt').textContent = 'offline';
    document.getElementById('led').style.background = '#f43f5e';
    document.getElementById('led').style.boxShadow = '0 0 6px #f43f5e';
    document.getElementById('led').style.animation = 'none';
  }
}

async function scan() {
  const code = document.getElementById('code').value.trim();
  if (!code) return;

  const btn = document.getElementById('scanBtn');
  btn.disabled = true;
  btn.innerHTML = '<div class="spinner" style="width:12px;height:12px;border-width:1.5px"></div> scanning...';

  const panel = document.getElementById('resultBody');
  panel.innerHTML = `<div class="loading"><div class="spinner"></div><span class="loading-text">analyzing for license violations...</span></div>`;

  const now = new Date().toLocaleTimeString('en-US',{hour12:false});

  try {
    const res = await fetch(URL + '/agent', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-GitHub-Token': 'ui-client' },
      body: JSON.stringify({
        messages: [{ role: 'user', content: `Scan this code:\n\`\`\`\n${code}\n\`\`\`` }]
      })
    });

    panel.innerHTML = '';

    const block = document.createElement('div');
    block.className = 'block';
    block.innerHTML = `
      <div class="block-head">
        <span class="block-title">@legal-defense</span>
        <span class="tag tag-amber" id="scanTag">scanning</span>
        <span class="ts">${now}</span>
      </div>
      <div class="block-body" id="out"></div>`;
    panel.appendChild(block);

    const out = document.getElementById('out');
    const cursor = document.createElement('span');
    cursor.className = 'cursor-blink';
    out.appendChild(cursor);

    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '', text = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop() || '';
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const d = line.slice(6).trim();
        if (d === '[DONE]') break;
        try {
          const p = JSON.parse(d);
          const tok = p?.choices?.[0]?.delta?.content;
          if (tok) { text += tok; out.textContent = text; out.appendChild(cursor); }
        } catch {}
      }
    }

    cursor.remove();
    out.textContent = text || 'No response received.';

    // set tag based on content
    const tag = document.getElementById('scanTag');
    const low = text.toLowerCase();
    if (low.includes('violation') || low.includes('gpl') || low.includes('critical')) {
      tag.className = 'tag tag-red'; tag.textContent = 'violation';
    } else if (low.includes('clean') || low.includes('no violation') || low.includes('safe')) {
      tag.className = 'tag tag-green'; tag.textContent = 'clean';
    } else {
      tag.className = 'tag tag-amber'; tag.textContent = 'review';
    }

  } catch (e) {
    panel.innerHTML = `
      <div class="block">
        <div class="block-head">
          <span class="block-title">error</span>
          <span class="tag tag-red">failed</span>
          <span class="ts">${now}</span>
        </div>
        <div class="block-body">connection failed — server may be warming up\n\n${e.message}</div>
      </div>`;
  }

  btn.disabled = false;
  btn.innerHTML = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg> scan for violations';
}

updateLines();
checkHealth();
</script>
</body>
</html>
